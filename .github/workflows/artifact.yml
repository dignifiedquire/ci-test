name: Artifacts
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Create artifact files
        run: |
          mkdir -p artifact-out
          echo "first-file-content" > artifact-out/a.txt
          echo "second-file-content" > artifact-out/b.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runy-compat-artifact
          path: artifact-out/
          if-no-files-found: error

  download:
    runs-on: ubuntu-latest
    needs: [upload]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: runy-compat-artifact
          path: artifact-in/

      - name: Verify contents
        run: |
          test "$(cat artifact-in/a.txt)" = "first-file-content"
          test "$(cat artifact-in/b.txt)" = "second-file-content"
          echo "artifact round-trip ok"
