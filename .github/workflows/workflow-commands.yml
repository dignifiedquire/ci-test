name: Workflow Commands

on:
  workflow_dispatch:

jobs:
  # Annotations: notice / warning / error
  annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Plain annotations
        run: |
          echo "::notice::This is a notice"
          echo "::warning::This is a warning"
          echo "::error::This is an error (job continues)"
        continue-on-error: true

      - name: Annotation with file/line
        run: |
          echo "::warning file=src/main.rs,line=42::Suspicious code"
          echo "::error file=src/main.rs,line=99,col=5,title=BadCode::Bad value"
        continue-on-error: true

      - name: After annotations
        run: echo "Annotations job ran $JOB_VAR steps"
        env:
          JOB_VAR: "three"

  # ::group:: / ::endgroup::
  grouping:
    runs-on: ubuntu-latest
    steps:
      - name: Grouped output
        run: |
          echo "Before group"
          echo "::group::Group A"
          echo "Inside group A line 1"
          echo "Inside group A line 2"
          echo "::endgroup::"
          echo "Between groups"
          echo "::group::Group B"
          echo "Inside group B"
          echo "::endgroup::"
          echo "After groups"

  # ::add-mask::
  masking:
    runs-on: ubuntu-latest
    steps:
      - name: Mask a literal
        run: |
          echo "::add-mask::SuperSecret123"
          echo "The secret is SuperSecret123"
          echo "Done masking"

      - name: Mask an env value
        env:
          MY_TOKEN: glpat-AAAA-BBBB-CCCC
        run: |
          echo "::add-mask::$MY_TOKEN"
          echo "Token: $MY_TOKEN"

  # GITHUB_ENV / GITHUB_PATH / GITHUB_OUTPUT (modern syntax)
  env-files:
    runs-on: ubuntu-latest
    outputs:
      job_out: ${{ steps.producer.outputs.kind }}
    steps:
      - name: Set env via GITHUB_ENV
        run: |
          echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=1.2.3" >> "$GITHUB_ENV"

      - name: Read env from previous step
        run: |
          echo "Build kind: $BUILD_KIND"
          echo "Build version: $BUILD_VERSION"

      - name: Set output via GITHUB_OUTPUT
        id: producer
        run: |
          echo "kind=cli-tool" >> "$GITHUB_OUTPUT"
          echo "version=4.2" >> "$GITHUB_OUTPUT"

      - name: Read output
        run: |
          echo "Kind: ${{ steps.producer.outputs.kind }}"
          echo "Version: ${{ steps.producer.outputs.version }}"

      - name: Add to PATH
        run: |
          mkdir -p "$RUNNER_TEMP/extra-bin"
          echo '#!/bin/sh' > "$RUNNER_TEMP/extra-bin/runy-marker"
          echo 'echo runy-marker-found' >> "$RUNNER_TEMP/extra-bin/runy-marker"
          chmod +x "$RUNNER_TEMP/extra-bin/runy-marker"
          echo "$RUNNER_TEMP/extra-bin" >> "$GITHUB_PATH"

      - name: Use PATH-added binary
        run: runy-marker

  # Job-output downstream consumption
  consume-output:
    runs-on: ubuntu-latest
    needs: [env-files]
    steps:
      - name: Read job output
        run: |
          echo "Got job output: ${{ needs.env-files.outputs.job_out }}"
